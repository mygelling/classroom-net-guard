<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上网管控系统 · 教师端控制台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EDF1EF;
  --surface:#FFFFFF;
  --ink:#17221F;
  --ink-2:#55645F;
  --ink-3:#7C8A85;
  --line:#E0E6E3;
  --brand:#0E7C66;
  --brand-strong:#0A5C4C;
  --brand-soft:#E4F1EC;
  --accent:#E0912F;
  --accent-soft:#FBF0DF;
  --ok:#16A34A;
  --ok-soft:#E8F6EC;
  --danger:#DC2626;
  --danger-soft:#FDEBEA;
  --warn:#D97706;
  --header:#14211E;
  --header-2:#1D2F2B;
  --radius:14px;
  --mono:ui-monospace,'Cascadia Mono','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
  background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:13px}
svg{display:block}
.ic{width:16px;height:16px;flex:none}

/* ===== 布局 ===== */
.app{display:grid;grid-template-rows:64px 1fr;height:100vh;min-width:1200px;overflow:hidden}
.main{
  display:grid;grid-template-columns:242px minmax(0,1fr) 474px;
  gap:14px;padding:14px;min-height:0;
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

/* ===== 顶栏 ===== */
header{
  background:linear-gradient(90deg,var(--header) 0%,var(--header-2) 100%);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;color:#EAF3F0;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
  width:38px;height:38px;border-radius:11px;background:var(--brand);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.brand-logo .ic{width:20px;height:20px}
.brand-title{font-size:17px;font-weight:900;letter-spacing:.5px;color:#FFFFFF}
.brand-sub{font-size:11.5px;color:#9FB8B0;margin-top:1px}
.head-right{display:flex;align-items:center;gap:22px}
.head-stats{display:flex;align-items:center;gap:18px}
.hstat{display:flex;align-items:baseline;gap:6px}
.hstat b{font-size:17px;font-weight:900;color:#FFFFFF}
.hstat .v{color:#7FE0C4}
.hstat .r{color:#FF9D9D}
.hstat .a{color:#F5C37C}
.hstat span{font-size:11.5px;color:#9FB8B0}
.mode-switch{
  display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:3px;gap:2px;
}
.mode-switch .opt{
  padding:5px 16px;border-radius:999px;font-size:12.5px;font-weight:700;color:#9FB8B0;
  transition:background .18s,color .18s;
}
.mode-switch .opt.active{background:var(--brand);color:#fff}
.mode-switch .opt.free.active{background:var(--accent);color:#fff}

/* ===== 左侧设备 ===== */
.devices{display:flex;flex-direction:column;min-height:0}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px 11px;border-bottom:1px solid var(--line);flex:none;
}
.panel-head h2{font-size:14px;font-weight:900}
.panel-head .sub{font-size:11.5px;color:var(--ink-3);font-weight:500}
.dev-list{padding:11px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.dev-card{
  border:1px solid var(--line);border-radius:12px;padding:10px;background:#FBFCFB;
  cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;
}
.dev-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(23,34,31,.07)}
.dev-card.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(14,124,102,.18)}
.dev-card.off{opacity:.62}
.dev-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.dot.off{background:#B9C4C0}
.dev-name{font-size:12.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.mini-badge.ok{background:var(--ok-soft);color:var(--ok)}
.mini-badge.danger{background:var(--danger-soft);color:var(--danger)}
.mini-badge.neutral{background:#EEF2F0;color:var(--ink-3)}
.mini-browser{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px}
.mini-bar{
  background:#E9EEEC;display:flex;align-items:center;gap:5px;padding:4px 7px;
}
.mini-bar .ic{width:11px;height:11px;color:var(--ink-3)}
.mini-bar span{font-family:var(--mono);font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-screen{height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700}
.mini-screen .ic{width:14px;height:14px}
.mini-screen.ok{background:var(--ok-soft);color:var(--ok)}
.mini-screen.danger{background:var(--danger-soft);color:var(--danger)}
.mini-screen.idle{background:#F2F4F3;color:var(--ink-3)}
.mini-screen.free{background:var(--accent-soft);color:var(--warn)}
.dev-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}
.dev-foot b{color:var(--danger);font-weight:700}

/* ===== 中央列 ===== */
.center{display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;min-height:0}
.policy{display:flex;flex-direction:column}
.policy .panel-head{flex:none}
.badge{
  font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand-strong);
}
.ver-chip{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.policy-body{padding:14px 15px;display:flex;flex-direction:column;gap:13px}
.add-row{display:flex;gap:8px}
#addInput{
  flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 11px;
  outline:none;background:#FBFCFB;transition:border-color .15s;
}
#addInput:focus{border-color:var(--brand)}
#addInput.err{border-color:var(--danger)}
.add-btn{
  background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;
  padding:0 16px;border-radius:9px;display:flex;align-items:center;gap:6px;
  transition:background .15s;
}
.add-btn:hover{background:var(--brand-strong)}
.add-btn .ic{width:14px;height:14px}
#addHint{font-size:11px;color:var(--danger);min-height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;
  border-radius:999px;background:var(--brand-soft);color:var(--brand-strong);
  font-size:12px;font-weight:600;font-family:var(--mono);
}
.chip .rm{
  width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--brand-strong);transition:background .15s,color .15s;
}
.chip .rm:hover{background:var(--brand);color:#fff}
.chip .rm .ic{width:10px;height:10px}
.dl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dl-row .lb{font-size:12.5px;font-weight:700;width:auto}
.switch{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch .track{
  position:absolute;inset:0;border-radius:999px;background:#C6D0CC;transition:background .18s;
}
.switch .thumb{
  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .track{background:var(--brand)}
.switch input:checked + .track + .thumb{transform:translateX(18px)}
.dl-state{font-size:12px;color:var(--ink-2)}
.type-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.type-chip{
  font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);background:#FBFCFB;color:var(--ink-2);transition:all .15s;
}
.type-chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong)}
.size-select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:none;background:#FBFCFB;font-size:12px}
.policy-foot{
  border-top:1px solid var(--line);padding:10px 15px;display:flex;justify-content:space-between;
  align-items:center;font-size:11px;color:var(--ink-3);
}
.policy-foot b{color:var(--brand-strong);font-weight:700}

/* 日志 */
.logs{display:flex;flex-direction:column;min-height:0}
.logs .panel-head{flex:none}
.filters{display:flex;gap:4px}
.filter{
  font-size:11.5px;font-weight:600;color:var(--ink-3);padding:3px 10px;border-radius:999px;
  transition:all .15s;
}
.filter.active{background:var(--brand-soft);color:var(--brand-strong)}
.clear-btn{font-size:11.5px;color:var(--ink-3);padding:3px 8px;border-radius:6px}
.clear-btn:hover{color:var(--danger);background:var(--danger-soft)}
.log-list{overflow-y:auto;min-height:0;padding:6px 12px 10px}
.log-row{
  display:flex;align-items:center;gap:10px;padding:6.5px 4px;border-bottom:1px dashed var(--line);
  font-size:12px;
}
.log-row:last-child{border-bottom:none}
.log-time{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:none;width:66px}
.log-dev{flex:none;font-weight:700;color:var(--ink-2);min-width:78px}
.log-event{flex:1;color:var(--ink);font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip{flex:none;font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:999px}
.rchip.ok{background:var(--ok-soft);color:var(--ok)}
.rchip.danger{background:var(--danger-soft);color:var(--danger)}
.rchip.accent{background:var(--accent-soft);color:var(--accent)}
.rchip.neutral{background:#EEF2F0;color:var(--ink-3)}
.log-empty{text-align:center;color:var(--ink-3);padding:28px 0;font-size:12px}

/* ===== 右侧浏览器 ===== */
.viewer{display:flex;flex-direction:column;min-height:0}
.viewer-info{
  display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line);flex:none;
}
.viewer-info .dev-avatar{
  width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand-strong);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none;
}
.viewer-info .vi-name{font-weight:800;font-size:13.5px}
.viewer-info .vi-meta{font-size:11px;color:var(--ink-3)}
.viewer-info .vi-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.vidot{width:8px;height:8px;border-radius:50%}
.vidot.on{background:var(--ok)}
.vidot.off{background:#B9C4C0}
.vistate{font-size:11px;font-weight:700}
.vistate.ok{color:var(--ok)}
.vistate.danger{color:var(--danger)}
.browser{display:flex;flex-direction:column;min-height:0;flex:1;padding:12px 14px 0}
.browser-bar{display:flex;align-items:center;gap:7px;padding-bottom:10px;flex:none}
.navbtn{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);transition:background .15s,color .15s;
}
.navbtn:hover{background:#EEF2F0;color:var(--ink)}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn:disabled:hover{background:none}
.addr{
  flex:1;display:flex;align-items:center;gap:8px;background:#F2F4F3;
  border:1px solid var(--line);border-radius:9px;padding:0 10px;height:32px;
}
.addr .ic{width:14px;height:14px;color:var(--ink-3)}
.addr.locked .ic{color:var(--danger)}
#addrInput{flex:1;border:none;outline:none;background:none;font-family:var(--mono);font-size:12px;color:var(--ink)}
.go-btn{
  background:var(--brand);color:#fff;font-weight:700;font-size:12px;
  padding:0 15px;height:32px;border-radius:9px;transition:background .15s;
}
.go-btn:hover{background:var(--brand-strong)}
.browser-body{
  flex:1;min-height:0;border:1px solid var(--line);border-radius:11px;overflow-y:auto;
  background:#FBFCFB;
}
/* 页面视图 */
.page{padding:22px;min-height:100%;display:flex;flex-direction:column}
.page.allowed{background:var(--ok-soft)}
.page.blocked{background:var(--danger-soft)}
.page.free{background:var(--accent-soft)}
.page.idle{background:#F4F6F5;align-items:center;justify-content:center;text-align:center;color:var(--ink-3)}
.offline-page{background:#F4F6F5;align-items:center;justify-content:center;text-align:center;color:var(--ink-3);min-height:100%;display:flex;flex-direction:column;gap:8px}
.big-ic{width:46px;height:46px;margin:0 auto 12px}
.page.allowed .big-ic{color:var(--ok)}
.page.blocked .big-ic{color:var(--danger)}
.page.free .big-ic{color:var(--warn)}
.page h3{font-size:19px;font-weight:900;margin-bottom:5px}
.page .host{font-family:var(--mono);font-size:12.5px;font-weight:700;margin-bottom:4px}
.page .desc{font-size:12px;color:var(--ink-2);margin-bottom:14px}
.site-card{
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:4px;
}
.site-card .sc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.site-card .sc-logo{
  width:26px;height:26px;border-radius:7px;background:var(--brand-soft);color:var(--brand-strong);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;
}
.site-card .sc-name{font-weight:800;font-size:13px}
.site-card .sc-flag{font-size:10.5px;color:var(--ok);font-weight:700;background:var(--ok-soft);padding:1px 7px;border-radius:999px}
.skel{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.skel i{display:block;height:9px;border-radius:5px;background:#E9EEEC}
.skel i:nth-child(1){width:42%}
.skel i:nth-child(2){width:100%}
.skel i:nth-child(3){width:88%}
.skel i:nth-child(4){width:64%}
.apply-btn{
  align-self:flex-start;background:var(--brand);color:#fff;font-weight:700;font-size:12px;
  padding:8px 16px;border-radius:9px;display:flex;align-items:center;gap:7px;transition:background .15s;
}
.apply-btn:hover{background:var(--brand-strong)}
.apply-btn .ic{width:14px;height:14px}
.free-note{font-size:12px;color:var(--warn);font-weight:600;background:#fff;padding:8px 12px;border-radius:9px;border:1px solid rgba(224,145,47,.35)}
.dl-dock{
  flex:none;display:flex;align-items:center;gap:8px;padding:11px 14px 13px;flex-wrap:wrap;
}
.dl-label{font-size:11.5px;font-weight:800;color:var(--ink-3)}
.file-btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#FBFCFB;
  border-radius:9px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--ink-2);
  transition:all .15s;
}
.file-btn:hover{border-color:var(--brand);color:var(--brand-strong);background:var(--brand-soft)}
.file-btn .ic{width:13px;height:13px;color:var(--brand)}

/* ===== Toast ===== */
#toast{
  position:fixed;top:76px;right:20px;z-index:50;display:flex;flex-direction:column;gap:8px;
}
.toast-item{
  display:flex;align-items:center;gap:8px;background:#1B2724;color:#fff;
  padding:10px 15px;border-radius:11px;font-size:12.5px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.18);animation:tin .22s ease-out;
  max-width:340px;
}
.toast-item .tdot{width:8px;height:8px;border-radius:50%;flex:none}
.toast-item.ok .tdot{background:var(--ok)}
.toast-item.danger .tdot{background:var(--danger)}
.toast-item.accent .tdot{background:var(--accent)}
.toast-item.out{opacity:0;transform:translateX(8px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#C8D2CE;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-logo" id="brandIcon"></div>
      <div>
        <div class="brand-title">上网管控</div>
        <div class="brand-sub">教师端控制台 · 局域网教室</div>
      </div>
    </div>
    <div class="head-right">
      <div class="head-stats">
        <div class="hstat"><b id="stOnline">0</b><span>在线设备</span></div>
        <div class="hstat"><b class="r" id="stBlocked">0</b><span>访问拦截</span></div>
        <div class="hstat"><b class="a" id="stDl">0</b><span>下载拦截</span></div>
      </div>
      <div class="mode-switch" id="modeSwitch">
        <span class="opt active" data-mode="on">课堂管控</span>
        <span class="opt" data-mode="off">自由模式</span>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 左侧：设备监控墙 -->
    <aside class="panel devices">
      <div class="panel-head">
        <h2>班级设备</h2>
        <span class="sub" id="devSub"></span>
      </div>
      <div class="dev-list" id="devList"></div>
    </aside>

    <!-- 中央：策略 + 日志 -->
    <section class="center">
      <div class="panel policy">
        <div class="panel-head">
          <h2>网站白名单</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="badge">白名单制 · 默认全拦</span>
            <span class="ver-chip" id="verChip"></span>
          </div>
        </div>
        <div class="policy-body">
          <div>
            <div class="add-row">
              <input id="addInput" placeholder="输入域名，如 baidu.com 或 *.edu.cn" autocomplete="off" spellcheck="false">
              <button class="add-btn" id="addBtn"></button>
            </div>
            <div id="addHint"></div>
          </div>
          <div class="chips" id="allowChips"></div>
          <div class="dl-row">
            <span class="lb">允许学生下载文件</span>
            <label class="switch">
              <input type="checkbox" id="dlSwitch">
              <span class="track"></span>
              <span class="thumb"></span>
            </label>
            <span class="dl-state" id="dlState"></span>
          </div>
          <div id="dlBody" style="display:none">
            <div class="type-group" id="typeGroup"></div>
            <div class="dl-row" style="margin-top:9px">
              <span class="lb" style="font-weight:600">单文件上限</span>
              <select class="size-select" id="sizeSelect">
                <option value="10">10 MB</option>
                <option value="50" selected>50 MB</option>
                <option value="200">200 MB</option>
                <option value="0">不限</option>
              </select>
            </div>
          </div>
        </div>
        <div class="policy-foot">
          <span id="syncNote"></span>
          <span>规则：*.edu.cn 匹配该域及其全部子域</span>
        </div>
      </div>

      <div class="panel logs">
        <div class="panel-head">
          <h2>实时日志</h2>
          <div style="display:flex;gap:10px;align-items:center">
            <div class="filters" id="logFilters">
              <button class="filter active" data-filter="all">全部</button>
              <button class="filter" data-filter="拦截">拦截</button>
              <button class="filter" data-filter="放行">放行</button>
              <button class="filter" data-filter="策略">策略</button>
            </div>
            <button class="clear-btn" id="clearLogs">清空</button>
          </div>
        </div>
        <div class="log-list" id="logList"></div>
      </div>
    </section>

    <!-- 右侧：学生模拟浏览器 -->
    <section class="panel viewer">
      <div class="viewer-info" id="viewerInfo"></div>
      <div class="browser">
        <div class="browser-bar">
          <button class="navbtn" id="navBack"></button>
          <button class="navbtn" id="navFwd"></button>
          <button class="navbtn" id="navReload"></button>
          <div class="addr" id="addrBox">
            <span id="addrIcon"></span>
            <input id="addrInput" placeholder="输入网址，回车模拟访问" autocomplete="off" spellcheck="false">
          </div>
          <button class="go-btn" id="goBtn">访问</button>
        </div>
        <div class="browser-body" id="browserBody"></div>
      </div>
      <div class="dl-dock">
        <span class="dl-label">模拟下载</span>
        <button class="file-btn" data-file="0"><span id="fIco0"></span>课件-数学.pdf · 38 MB</button>
        <button class="file-btn" data-file="1"><span id="fIco1"></span>游戏安装包.exe · 1.2 GB</button>
      </div>
    </section>
  </main>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ===== 图标（内联 SVG） ===== */
var ICONS={
  shield:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>',
  monitor:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  globe:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>',
  lock:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  unlock:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 017.2-2.2"/></svg>',
  download:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5"/><path d="M4 21h16"/></svg>',
  plus:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  refresh:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.6-6.4"/><path d="M21 3v6h-6"/></svg>',
  left:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  ban:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/></svg>',
  flag:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 3.5L17 11H5"/></svg>',
  file:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>'
};
function icon(name,cls){ return ICONS[name]||''; }

/* ===== 初始数据 ===== */
var INIT_ALLOW=['*.baidu.com','*.edu.cn','*.gov.cn','office.com','w3schools.com.cn'];
var state={
  classroomOn:true,
  download:{enabled:false,allowTypes:['pdf','docx','pptx'],maxSizeMB:50},
  allowDomains:INIT_ALLOW.slice(),
  policyVersion:12,
  stats:{blocked:12,dlBlocked:3,requests:0},
  selectedId:2,
  devices:[
    {id:1,seat:'01',name:'李明',online:true,ip:'192.168.1.11',blocked:2,cd:0,last:{url:'www.baidu.com',result:'allowed'}},
    {id:2,seat:'02',name:'王芳',online:true,ip:'192.168.1.12',blocked:4,cd:0,last:{url:'www.4399.com',result:'blocked'}},
    {id:3,seat:'03',name:'张伟',online:true,ip:'192.168.1.13',blocked:1,cd:0,last:{url:'www.moe.gov.cn',result:'allowed'}},
    {id:4,seat:'04',name:'刘洋',online:true,ip:'192.168.1.14',blocked:3,cd:0,last:{url:'www.w3schools.com.cn',result:'allowed'}},
    {id:5,seat:'05',name:'陈晨',online:true,ip:'192.168.1.15',blocked:2,cd:0,last:{url:null,result:'idle'}},
    {id:6,seat:'06',name:'赵欣',online:false,ip:'192.168.1.16',blocked:0,cd:0,last:null}
  ],
  logs:[]
};
var UI={filter:'all',addVal:''};

var POOL_ALLOW=['www.baidu.com','news.baidu.com','www.moe.gov.cn','office.com','www.w3schools.com.cn','map.edu.cn','www.gov.cn'];
var POOL_BLOCK=['www.4399.com','www.bilibili.com','www.douyin.com','www.taobao.com','game.qq.com','www.douyu.com','www.kuaishou.com','www.yy.com'];
var POOL_FILES=[
  {name:'课件-数学.pdf',sizeMB:38},
  {name:'作业-语文.docx',sizeMB:2},
  {name:'游戏安装包.exe',sizeMB:1228},
  {name:'视频-电影.mp4',sizeMB:880},
  {name:'压缩软件.zip',sizeMB:180}
];

/* ===== 工具函数 ===== */
function $(s){ return document.querySelector(s); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return (n<10?'0':'')+n; }
function fmt(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function hostOf(raw){
  var s=(raw||'').trim();
  if(!s) return '';
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(s)) s='http://'+s;
  try{ return new URL(s).hostname.toLowerCase(); }catch(e){ return ''; }
}
function getSel(){ return state.devices.find(function(d){ return d.id===state.selectedId; }); }
function onlineCount(){ return state.devices.filter(function(d){ return d.online; }).length; }

function matchAllow(host){
  if(!host) return false;
  if(!state.classroomOn) return true;
  return state.allowDomains.some(function(p){
    p=p.toLowerCase();
    if(p.indexOf('*.')===0){
      var core=p.slice(2);
      return host===core || host.slice(-core.length-1)==='.'+core;
    }
    return host===p || host.slice(-p.length-1)==='.'+p;
  });
}

function checkDownload(file){
  var ext=file.name.split('.').pop().toLowerCase();
  if(!state.download.enabled) return {ok:false,reason:'教师端已开启“禁止下载”'};
  if(state.download.allowTypes.indexOf(ext)<0) return {ok:false,reason:'文件类型 .'+ext+' 不在允许列表内'};
  var max=state.download.maxSizeMB;
  if(max>0 && file.sizeMB>max) return {ok:false,reason:'文件 '+file.sizeMB+' MB 超过大小限制 '+max+' MB'};
  return {ok:true};
}

function pushLog(dev,event,result){
  state.logs.unshift({t:fmt(new Date()),d:dev,e:event,r:result});
  if(state.logs.length>90) state.logs.pop();
  renderLogs();
}

function toast(msg,type){
  var box=$('#toast');
  var el=document.createElement('div');
  el.className='toast-item '+(type||'');
  var dot=type==='ok'?'ok':(type==='danger'?'danger':'accent');
  el.innerHTML='<span class="tdot"></span><span>'+esc(msg)+'</span>';
  el.querySelector('.tdot').classList.add(dot);
  box.appendChild(el);
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); },320); },2400);
}

/* ===== 核心动作 ===== */
function visit(dev,raw){
  var host=hostOf(raw);
  if(!host){ toast('请输入有效网址，如 baidu.com','danger'); return; }
  var res;
  if(!state.classroomOn){ res='放行'; }
  else{ res=matchAllow(host)?'放行':'拦截'; }
  dev.last={url:host,result:res==='放行'?'allowed':'blocked'};
  state.stats.requests++;
  if(res==='拦截'){ state.stats.blocked++; dev.blocked++; }
  pushLog(dev.name,'访问 '+host,res);
  renderDevices(); renderViewer(); renderStats();
}

function tryDownload(dev,file){
  var r=checkDownload(file);
  if(r.ok){
    pushLog(dev.name,'下载 '+file.name+'（'+file.sizeMB+' MB）','放行');
    toast('已开始下载 '+file.name+'（模拟）','ok');
  }else{
    state.stats.dlBlocked++; dev.blocked=(dev.blocked||0)+0;
    pushLog(dev.name,'下载 '+file.name+'（'+file.sizeMB+' MB）','拦截');
    toast('下载被拦截：'+r.reason,'danger');
  }
  renderStats();
}

function bumpVersion(reason,devName){
  state.policyVersion++;
  pushLog('教师端',reason,'策略');
  renderChips(); renderStats();
}

/* ===== 渲染：设备监控墙 ===== */
function devBadge(dev){
  if(!dev.online) return '<span class="mini-badge neutral">离线</span>';
  if(!state.classroomOn) return '<span class="mini-badge neutral">自由</span>';
  if(!dev.last||dev.last.result==='idle') return '<span class="mini-badge neutral">待机</span>';
  return dev.last.result==='allowed'
    ? '<span class="mini-badge ok">放行</span>'
    : '<span class="mini-badge danger">拦截</span>';
}
function devScreen(dev){
  if(!dev.online) return '<div class="mini-screen idle">离线 · 未连接</div>';
  if(!state.classroomOn) return '<div class="mini-screen free">'+icon('unlock')+'<span>自由模式 · 全部放行</span></div>';
  if(!dev.last||dev.last.result==='idle') return '<div class="mini-screen idle">'+icon('globe')+'<span>新标签页</span></div>';
  if(dev.last.result==='blocked'){
    return '<div class="mini-screen danger">'+icon('ban')+'<span>'+esc(dev.last.url)+'</span></div>';
  }
  return '<div class="mini-screen ok">'+icon('check')+'<span>'+esc(dev.last.url)+'</span></div>';
}
function renderDevices(){
  var list=$('#devList');
  var html='';
  state.devices.forEach(function(dev){
    var sel=dev.id===state.selectedId?' sel':'';
    var off=dev.online?'':' off';
    html+='<div class="dev-card'+sel+off+'" data-id="'+dev.id+'">'
      +'<div class="dev-top"><span class="dot '+(dev.online?'on':'off')+'"></span>'
      +'<span class="dev-name">'+dev.seat+' · '+esc(dev.name)+'</span>'
      +devBadge(dev)+'</div>'
      +'<div class="mini-browser"><div class="mini-bar">'+icon('globe')+'<span>'
      +(dev.last&&dev.last.url?esc(dev.last.url):'about:newtab')+'</span></div>'
      +devScreen(dev)+'</div>'
      +'<div class="dev-foot"><span>'+esc(dev.ip)+'</span><span>拦截 <b>'+dev.blocked+'</b> 次</span></div>'
      +'</div>';
  });
  list.innerHTML=html;
  $('#devSub').textContent=onlineCount()+' / '+state.devices.length+' 台在线';
}

/* ===== 渲染：白名单与下载策略 ===== */
function renderChips(){
  var box=$('#allowChips');
  if(!state.allowDomains.length){
    box.innerHTML='<span style="font-size:11.5px;color:var(--ink-3)">白名单为空：所有网站将被拦截。添加域名后学生端立即生效。</span>';
  }else{
    box.innerHTML=state.allowDomains.map(function(d){
      return '<span class="chip">'+esc(d)
        +'<button class="rm" data-rm="'+esc(d)+'">'+icon('x')+'</button></span>';
    }).join('');
  }
  $('#verChip').textContent='v'+state.policyVersion;
  var online=onlineCount();
  $('#syncNote').innerHTML='策略 <b>v'+state.policyVersion+'</b> · 已同步 <b>'+online+'</b> 台设备';
}
function renderDl(){
  $('#dlSwitch').checked=state.download.enabled;
  $('#dlBody').style.display=state.download.enabled?'block':'none';
  $('#dlState').textContent=state.download.enabled?'当前允许：'+state.download.allowTypes.join(' / ')+' · 上限 '+state.download.maxSizeMB+' MB':'全局禁止下载（所有文件类型）';
  var types=['pdf','docx','pptx','zip','xlsx'];
  $('#typeGroup').innerHTML=types.map(function(t){
    return '<button class="type-chip'+(state.download.allowTypes.indexOf(t)>=0?' on':'')+'" data-type="'+t+'">'+t+'</button>';
  }).join('');
  $('#sizeSelect').value=String(state.download.maxSizeMB);
}

/* ===== 渲染：日志 ===== */
function renderLogs(){
  var box=$('#logList');
  var rows=state.logs.filter(function(l){
    if(UI.filter==='all') return true;
    return l.r===UI.filter;
  });
  if(!rows.length){
    box.innerHTML='<div class="log-empty">暂无'+UI.filter+'记录</div>';
    return;
  }
  var map={放行:'ok',拦截:'danger',策略:'accent',申请:'accent',自由:'neutral'};
  box.innerHTML=rows.map(function(l){
    return '<div class="log-row"><span class="log-time">'+l.t+'</span>'
      +'<span class="log-dev">'+esc(l.d)+'</span>'
      +'<span class="log-event">'+esc(l.e)+'</span>'
      +'<span class="rchip '+(map[l.r]||'neutral')+'">'+l.r+'</span></div>';
  }).join('');
  box.scrollTop=box.scrollHeight;
}

/* ===== 渲染：统计 ===== */
function renderStats(){
  $('#stOnline').textContent=onlineCount()+' / '+state.devices.length;
  $('#stBlocked').textContent=state.stats.blocked;
  $('#stDl').textContent=state.stats.dlBlocked;
  var m=$('#modeSwitch');
  m.querySelectorAll('.opt').forEach(function(o){
    var on=o.getAttribute('data-mode')==='on';
    o.classList.toggle('active', on===state.classroomOn);
    o.classList.toggle('free', !on);
  });
}

/* ===== 渲染：学生模拟浏览器 ===== */
function renderViewer(){
  var dev=getSel();
  var info=$('#viewerInfo');
  info.innerHTML='<div class="dev-avatar">'+esc(dev.seat)+'</div>'
    +'<div><div class="vi-name">学生机-'+esc(dev.seat)+' · '+esc(dev.name)+'</div>'
    +'<div class="vi-meta">'+esc(dev.ip)+' · 白名单策略同步中</div></div>'
    +'<div class="vi-right"><span class="vidot '+(dev.online?'on':'off')+'"></span>'
    +'<span class="vistate '+(dev.online?'':'')+'">'+(dev.online?'在线':'离线')+'</span></div>';

  var body=$('#browserBody');
  var addr=$('#addrInput');
  var box=$('#addrBox');

  if(!dev.online){
    body.innerHTML='<div class="offline-page">'+icon('monitor','big-ic')+'<div style="font-weight:800;font-size:14px">设备离线</div><div style="font-size:12px">无法查看该学生机的访问状态</div></div>';
    box.classList.remove('locked');
    $('#addrIcon').innerHTML=icon('globe');
    addr.value='';
    addr.disabled=true;
    $('#goBtn').disabled=true;
    $('#navReload').disabled=true;
    return;
  }
  addr.disabled=false;
  $('#goBtn').disabled=false;
  $('#navReload').disabled=false;

  if(!state.classroomOn){
    box.classList.remove('locked');
    $('#addrIcon').innerHTML=icon('unlock');
    body.innerHTML='<div class="page free"><div class="big-ic">'+icon('unlock')+'</div>'
      +'<h3>自由模式</h3><div class="desc">教师已开放全部网站访问，白名单暂不生效。</div>'
      +'<div class="free-note">回到“课堂管控”后，白名单规则将立即恢复生效。</div></div>';
    addr.value='';
    return;
  }

  if(!dev.last||dev.last.result==='idle'){
    box.classList.remove('locked');
    $('#addrIcon').innerHTML=icon('globe');
    body.innerHTML='<div class="page idle">'+icon('globe','big-ic')+'<div style="font-weight:800;font-size:14px">新标签页</div><div style="font-size:12px">该学生当前未访问任何网站</div></div>';
    addr.value='';
    return;
  }

  addr.value=dev.last.url;
  if(dev.last.result==='blocked'){
    box.classList.add('locked');
    $('#addrIcon').innerHTML=icon('lock');
    body.innerHTML='<div class="page blocked"><div class="big-ic">'+icon('ban')+'</div>'
      +'<h3>访问已被拦截</h3>'
      +'<div class="host">'+esc(dev.last.url)+'</div>'
      +'<div class="desc">该网站不在教师白名单内，本次访问已记录并上报教师端。</div>'
      +'<button class="apply-btn" id="applyBtn">'+icon('flag')+'申请访问</button>'
      +'<div style="margin-top:14px;font-size:11px;color:var(--ink-3)">教师端收到申请后可一键加入白名单，随后学生刷新即可访问。</div></div>';
    var ab=$('#applyBtn');
    if(ab){ ab.addEventListener('click',function(){
      pushLog('学生机-'+dev.seat,'申请访问 '+dev.last.url,'申请');
      toast('已向教师端发送访问申请','accent');
    }); }
  }else{
    box.classList.remove('locked');
    $('#addrIcon').innerHTML=icon('globe');
    body.innerHTML='<div class="page allowed"><div class="big-ic">'+icon('check')+'</div>'
      +'<h3>已放行</h3>'
      +'<div class="host">'+esc(dev.last.url)+'</div>'
      +'<div class="desc">该网站在白名单内，页面正常加载（以下为原型占位页）。</div>'
      +'<div class="site-card"><div class="sc-head">'
      +'<div class="sc-logo">'+esc(dev.last.url.charAt(0).toUpperCase())+'</div>'
      +'<div class="sc-name">'+esc(dev.last.url)+'</div>'
      +'<span class="sc-flag">白名单内 · 已放行</span></div>'
      +'<div class="skel"><i></i><i></i><i></i><i></i></div></div></div>';
  }
}

/* ===== 模拟引擎 ===== */
function seedLogs(){
  var now=Date.now();
  var seed=[
    [70,'学生机-05','访问 www.douyin.com','拦截'],
    [95,'学生机-02','下载 游戏安装包.exe（1228 MB）','拦截'],
    [120,'教师端','添加白名单 *.gov.cn','策略'],
    [150,'学生机-03','访问 www.moe.gov.cn','放行'],
    [180,'学生机-04','访问 www.w3schools.com.cn','放行'],
    [210,'学生机-01','访问 www.baidu.com','放行'],
    [240,'学生机-02','访问 www.4399.com','拦截']
  ];
  seed.forEach(function(s){
    state.logs.push({t:fmt(new Date(now-s[0]*1000)),d:s[1],e:s[2],r:s[3]});
  });
}
function tick(){
  state.devices.forEach(function(dev){
    if(!dev.online) return;
    if(dev.cd>0){ dev.cd--; return; }
    if(Math.random()>0.5) return;
    dev.cd=Math.floor(Math.random()*3);
    if(Math.random()<0.72){
      var url=Math.random()<0.55?pick(POOL_ALLOW):pick(POOL_BLOCK);
      visit(dev,url);
    }else{
      tryDownload(dev,pick(POOL_FILES));
    }
  });
}

/* ===== 事件绑定 ===== */
function bind(){
  $('#brandIcon').innerHTML=icon('shield');
  $('#addBtn').innerHTML=icon('plus')+'添加';
  $('#navBack').innerHTML=icon('left');
  $('#navFwd').innerHTML=icon('right');
  $('#navReload').innerHTML=icon('refresh');
  $('#fIco0').innerHTML=icon('file');
  $('#fIco1').innerHTML=icon('file');
  $('#goBtn').textContent='访问';

  // 设备选择
  $('#devList').addEventListener('click',function(e){
    var card=e.target.closest('.dev-card');
    if(!card) return;
    state.selectedId=+card.getAttribute('data-id');
    renderDevices(); renderViewer();
  });

  // 白名单添加
  function addDomain(){
    var input=$('#addInput');
    var v=input.value.trim();
    var hint=$('#addHint');
    input.classList.remove('err');
    if(!v){ hint.textContent='请输入域名'; input.classList.add('err'); return; }
    if(!/^(\*\.)?([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/i.test(v)){
      hint.textContent='格式不正确：请输入 baidu.com 或 *.edu.cn，不要带协议和路径';
      input.classList.add('err'); return;
    }
    var lower=v.toLowerCase();
    if(state.allowDomains.indexOf(lower)>=0){
      hint.textContent='该域名已在白名单中'; input.classList.add('err'); return;
    }
    hint.textContent='';
    state.allowDomains.push(lower);
    input.value='';
    bumpVersion('添加白名单 '+lower);
    toast('已加入白名单，学生端立即生效','ok');
  }
  $('#addBtn').addEventListener('click',addDomain);
  $('#addInput').addEventListener('keydown',function(e){
    if(e.key==='Enter') addDomain();
  });
  $('#addInput').addEventListener('input',function(){ this.classList.remove('err'); $('#addHint').textContent=''; });

  // 白名单删除
  $('#allowChips').addEventListener('click',function(e){
    var rm=e.target.closest('.rm');
    if(!rm) return;
    var d=rm.getAttribute('data-rm');
    state.allowDomains=state.allowDomains.filter(function(x){ return x!==d; });
    bumpVersion('移除白名单 '+d);
    toast('已移除 '+d+'，该域名立即拦截','accent');
  });

  // 下载开关
  $('#dlSwitch').addEventListener('change',function(){
    state.download.enabled=this.checked;
    renderDl();
    bumpVersion(this.checked?'开启下载（'+state.download.allowTypes.join('/')+'）':'开启“禁止下载”');
  });
  // 类型
  $('#typeGroup').addEventListener('click',function(e){
    var chip=e.target.closest('.type-chip');
    if(!chip) return;
    var t=chip.getAttribute('data-type');
    var i=state.download.allowTypes.indexOf(t);
    if(i>=0) state.download.allowTypes.splice(i,1);
    else state.download.allowTypes.push(t);
    renderDl();
    bumpVersion('更新下载类型：'+state.download.allowTypes.join('/')+'（当前'+(state.download.enabled?'允许':'禁止')+'下载）');
  });
  // 大小
  $('#sizeSelect').addEventListener('change',function(){
    state.download.maxSizeMB=parseInt(this.value,10);
    bumpVersion('单文件上限调整为 '+this.value+' MB');
  });

  // 模式切换
  $('#modeSwitch').addEventListener('click',function(e){
    var opt=e.target.closest('.opt');
    if(!opt) return;
    var on=opt.getAttribute('data-mode')==='on';
    if(on===state.classroomOn) return;
    state.classroomOn=on;
    renderStats(); renderDevices(); renderViewer();
    pushLog('教师端',on?'切换为课堂管控模式':'切换为自由模式（全部放行）','策略');
    toast(on?'课堂管控已开启，白名单生效':'自由模式已开启，全部网站放行',on?'ok':'accent');
  });

  // 日志过滤 / 清空
  $('#logFilters').addEventListener('click',function(e){
    var f=e.target.closest('.filter');
    if(!f) return;
    UI.filter=f.getAttribute('data-filter');
    this.querySelectorAll('.filter').forEach(function(x){ x.classList.toggle('active',x===f); });
    renderLogs();
  });
  $('#clearLogs').addEventListener('click',function(){ state.logs=[]; renderLogs(); });

  // 浏览器地址栏
  function go(){
    var dev=getSel();
    if(!dev.online) return;
    var v=$('#addrInput').value.trim();
    if(!v) return;
    visit(dev,v);
  }
  $('#goBtn').addEventListener('click',go);
  $('#addrInput').addEventListener('keydown',function(e){
    if(e.key==='Enter') go();
  });
  $('#navReload').addEventListener('click',function(){
    var dev=getSel();
    if(!dev.online) return;
    var url=(dev.last&&dev.last.url)?dev.last.url:pick(POOL_ALLOW);
    visit(dev,url);
  });
  $('#navBack').addEventListener('click',function(){ toast('原型中后退键为示意','accent'); });
  $('#navFwd').addEventListener('click',function(){ toast('原型中前进键为示意','accent'); });

  // 模拟下载按钮
  $('#viewer').addEventListener('click',function(e){
    var btn=e.target.closest('.file-btn');
    if(!btn) return;
    var dev=getSel();
    if(!dev.online){ toast('设备离线，无法下载','danger'); return; }
    tryDownload(dev,POOL_FILES[+btn.getAttribute('data-file')]);
  });
}

/* ===== 初始化 ===== */
function init(){
  seedLogs();
  renderChips(); renderDl(); renderLogs(); renderDevices(); renderViewer(); renderStats();
  setInterval(tick,2400);
}
bind();
init();
})();
</script>
</body>
</html>
